trigger:
  branches:
    include: ['{{BRANCH}}']
  paths:
    include: [fabric/**, cicd/fabric/**, cicd/shared/**]
    exclude: [pbi/**, cicd/powerbi/**]
pr: none

pool:
  vmImage: ubuntu-latest

stages:
- stage: Build{{ENV_TITLE}}Artifact
  jobs:
  - job: ValidateAndPackage
    steps:
    - template: validation-steps.yml
    - script: python cicd/fabric/build_release.py --validation "$(Build.ArtifactStagingDirectory)/managed-manifest.json" --out "$(Build.ArtifactStagingDirectory)/fabric-{{env}}-release.zip" --target {{ENV}} --expected-revision "$(Build.SourceVersion)"
      displayName: Package immutable {{ENV}} artifact
    - publish: $(Build.ArtifactStagingDirectory)/fabric-{{env}}-release.zip
      artifact: fabric-{{env}}-release

- stage: Deploy{{ENV_TITLE}}
  dependsOn: Build{{ENV_TITLE}}Artifact
  condition: succeeded()
  jobs:
  - deployment: Deploy
    pool:
      name: '{{PRIVATE_POOL}}'
    environment: {{ADO_ENVIRONMENT}}
    variables:
    - group: '{{VARIABLE_GROUP}}'
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: none
          - download: current
            artifact: fabric-{{env}}-release
          - task: AzureKeyVault@2
            inputs:
              azureSubscription: '{{KEY_VAULT_SERVICE_CONNECTION}}'
              KeyVaultName: '{{KEY_VAULT_NAME}}'
              SecretsFilter: '{{KEY_VAULT_SECRET}}'
              RunAsPreJob: false
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.11'
          - task: PowerShell@2
            displayName: Verify every hash and extract the {{ENV}} artifact
            inputs:
              targetType: inline
              pwsh: true
              script: |
                $ErrorActionPreference = 'Stop'
                Add-Type -AssemblyName System.IO.Compression.FileSystem
                $zip = Join-Path '$(Pipeline.Workspace)' 'fabric-{{env}}-release/fabric-{{env}}-release.zip'
                $destination = Join-Path '$(Pipeline.Workspace)' 'fabric-{{env}}-release/extracted'
                New-Item -ItemType Directory -Path $destination -Force | Out-Null
                $root = [IO.Path]::GetFullPath($destination)
                $archive = [IO.Compression.ZipFile]::OpenRead($zip)
                try {
                  $entries = @($archive.Entries | Where-Object { -not [string]::IsNullOrEmpty($_.Name) })
                  $names = @($entries.FullName)
                  if (@($names | Group-Object | Where-Object Count -gt 1).Count -gt 0) { throw 'Duplicate archive member detected' }
                  foreach ($name in $names) {
                    $parts = @($name -split '/')
                    if ([string]::IsNullOrWhiteSpace($name) -or $name.Contains('\') -or $name.StartsWith('/') -or $name -match '^[A-Za-z]:' -or $parts -contains '..') { throw "Unsafe archive member: $name" }
                    $target = [IO.Path]::GetFullPath((Join-Path $root $name))
                    if (-not $target.StartsWith($root + [IO.Path]::DirectorySeparatorChar, [StringComparison]::OrdinalIgnoreCase)) { throw "Unsafe archive member: $name" }
                  }
                  $hashEntry = $entries | Where-Object FullName -eq 'content-hashes.json' | Select-Object -First 1
                  if (-not $hashEntry) { throw 'Artifact is missing content-hashes.json' }
                  $reader = [IO.StreamReader]::new($hashEntry.Open())
                  try { $hashes = $reader.ReadToEnd() | ConvertFrom-Json -AsHashtable } finally { $reader.Dispose() }
                  $actual = @($names | Where-Object { $_ -ne 'content-hashes.json' } | Sort-Object)
                  $expected = @($hashes.Keys | Sort-Object)
                  if (Compare-Object $actual $expected) { throw 'Artifact content-hash manifest does not match packaged files' }
                  $sha = [Security.Cryptography.SHA256]::Create()
                  try {
                    foreach ($entry in $entries | Where-Object FullName -ne 'content-hashes.json') {
                      $stream = $entry.Open()
                      try { $actualHash = ([BitConverter]::ToString($sha.ComputeHash($stream))).Replace('-', '').ToLowerInvariant() } finally { $stream.Dispose() }
                      if ($actualHash -ne $hashes[$entry.FullName]) { throw "Artifact content hash mismatch: $($entry.FullName)" }
                    }
                  } finally { $sha.Dispose() }
                  foreach ($entry in $entries) {
                    $target = Join-Path $root $entry.FullName
                    New-Item -ItemType Directory -Path (Split-Path $target -Parent) -Force | Out-Null
                    [IO.Compression.ZipFileExtensions]::ExtractToFile($entry, $target, $true)
                  }
                } finally { $archive.Dispose() }
                Write-Host "Verified and extracted $(@($hashes.Keys).Count) hashed files."
          - pwsh: python -m pip install -r "$(Pipeline.Workspace)/fabric-{{env}}-release/extracted/cicd/fabric/requirements-fabric-cicd.lock"
            displayName: Install pinned deployment toolchain
          - pwsh: python "$(Pipeline.Workspace)/fabric-{{env}}-release/extracted/cicd/fabric/auth_check.py" --workspace {{WORKSPACE_ID}}
            displayName: Verify protected {{ENV}} service-principal metadata access before write
            env:
              FABRIC_TENANT_ID: $(FABRIC_TENANT_ID)
              FABRIC_APP_ID: $(FABRIC_APP_ID)
              FABRIC_APP_SECRET: $({{KEY_VAULT_SECRET}})
          - pwsh: python "$(Pipeline.Workspace)/fabric-{{env}}-release/extracted/cicd/fabric/deploy_artifact.py" --artifact "$(Pipeline.Workspace)/fabric-{{env}}-release/fabric-{{env}}-release.zip" --environment {{ENV}} --expected-revision "$(Build.SourceVersion)" --extracted-root "$(Pipeline.Workspace)/fabric-{{env}}-release/extracted"
            displayName: Deploy immutable {{ENV}} artifact
            env:
              FABRIC_TENANT_ID: $(FABRIC_TENANT_ID)
              FABRIC_APP_ID: $(FABRIC_APP_ID)
              FABRIC_APP_SECRET: $({{KEY_VAULT_SECRET}})
              ALLOW_FABRIC_{{ENV}}_WRITE: true
          - pwsh: python "$(Pipeline.Workspace)/fabric-{{env}}-release/extracted/cicd/fabric/record_release.py" --artifact "$(Pipeline.Workspace)/fabric-{{env}}-release/fabric-{{env}}-release.zip" --target {{ENV}}
            displayName: Record {{ENV}} release audit metadata
            condition: always()
