trigger:
  branches: { include: [dev, test, main, hotfix/*] }
  paths: { include: [pbi/**, cicd/powerbi/**] }
pr:
  branches: { include: [test, main] }

parameters:
  - { name: artifactName, type: string, default: powerbi-release }
  - { name: configPath, type: string, default: cicd/powerbi/bootstrap-config.json }
  - { name: manifestPath, type: string, default: cicd/powerbi/powerbi-assets.yml }
  - { name: devWorkspaceId, type: string }
  - { name: testWorkspaceId, type: string }
  - { name: prodWorkspaceId, type: string }
  - { name: hotfixWorkspaceId, type: string }
  - { name: devWriteGuard, type: string }
  - { name: testWriteGuard, type: string }
  - { name: prodWriteGuard, type: string }
  - { name: hotfixWriteGuard, type: string }
  - { name: testDigest, type: string, default: '' }

stages:
  - stage: Validate
    jobs:
      - job: OfflineValidation
        steps:
          - script: >-
              python deployment/scripts/powerbi_cicd.py validate --config '${{ parameters.configPath }}'
              --manifest '${{ parameters.manifestPath }}' --repo .
            displayName: Validate approved Power BI source boundary
  - stage: BuildRelease
    dependsOn: Validate
    condition: and(succeeded(), or(eq(variables['Build.SourceBranch'], 'refs/heads/dev'), startsWith(variables['Build.SourceBranch'], 'refs/heads/hotfix/')))
    jobs:
      - job: PackageOnce
        steps:
          - script: >-
              python deployment/scripts/build_release.py --config '${{ parameters.configPath }}'
              --manifest '${{ parameters.manifestPath }}' --repo . --target TEST
              --out '$(Build.ArtifactStagingDirectory)/${{ parameters.artifactName }}.zip'
              --revision '$(Build.SourceVersion)'
            displayName: Package immutable release once
          - publish: '$(Build.ArtifactStagingDirectory)/${{ parameters.artifactName }}.zip'
            artifact: ${{ parameters.artifactName }}
  - template: templates/deploy-stage.yml
    parameters: { stageName: DeployDev, target: DEV, workspaceId: '${{ parameters.devWorkspaceId }}', writeGuard: '${{ parameters.devWriteGuard }}', artifactName: '${{ parameters.artifactName }}', artifactSource: current, sourceBranch: dev, testDigest: '' }
  - template: templates/deploy-stage.yml
    parameters: { stageName: ValidateHotfix, target: HOTFIX, workspaceId: '${{ parameters.hotfixWorkspaceId }}', writeGuard: '${{ parameters.hotfixWriteGuard }}', artifactName: '${{ parameters.artifactName }}', artifactSource: current, sourceBranch: hotfix/*, testDigest: '' }
  - template: templates/deploy-stage.yml
    parameters: { stageName: DeployTest, target: TEST, workspaceId: '${{ parameters.testWorkspaceId }}', writeGuard: '${{ parameters.testWriteGuard }}', artifactName: '${{ parameters.artifactName }}', artifactSource: promotion, sourceBranch: test, testDigest: '' }
  - template: templates/deploy-stage.yml
    parameters: { stageName: DeployProd, target: PROD, workspaceId: '${{ parameters.prodWorkspaceId }}', writeGuard: '${{ parameters.prodWriteGuard }}', artifactName: '${{ parameters.artifactName }}', artifactSource: promotion, sourceBranch: main, testDigest: '${{ parameters.testDigest }}' }
